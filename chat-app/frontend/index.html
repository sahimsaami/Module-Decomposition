<!doctype html>
<html lang="en">
  <head>
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="chat-container">
      <h1>💬 Chat App</h1>
      <ul id="messages"></ul>

      <div class="form">
        <div class="username-row">
          <input id="username" placeholder="Your name" />
          <button
            class="change-user-btn"
            onclick="changeUser()"
            title="Change user"
          >
            ✏️
          </button>
        </div>

        <div class="input-row">
          <input id="message" placeholder="Write message" />
          <button
            class="schedule-btn"
            onclick="toggleSchedule()"
            title="Schedule message"
          >
            ⏰
          </button>
          <button class="send-btn" onclick="send()" title="Send">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

        <!-- Schedule panel (hidden by default) -->
        <div id="schedule-panel" class="schedule-panel hidden">
          <label>📅 Schedule send:</label>
          <input type="datetime-local" id="schedule-time" />
          <button class="cancel-schedule-btn" onclick="cancelSchedule()">
            Cancel
          </button>
        </div>

        <!-- Pending scheduled messages -->
        <div id="scheduled-list"></div>

        <button class="clear-btn" onclick="clearMessages()">Clear Chat</button>
      </div>

      <p id="status"></p>
    </div>
    <script src="script.js"></script>
    <footer>
      <p id="footer">
        &copy; 2026 Chat App. All rights reserved.
      </p>
    </footer>
  </body>
</html>
